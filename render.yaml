services:
  - type: web
    name: iq-ai-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: FRONTEND_URL
        value: https://iq-ai-frontend.onrender.com
      - key: CORS_ORIGINS
        value: '["https://iq-ai-frontend.onrender.com"]'
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_POOL_SIZE
        value: "3"
      - key: DATABASE_MAX_OVERFLOW
        value: "2"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: USE_S3
        value: "true"
      - key: AWS_BUCKET_NAME
        value: iq-ai-resumes
      - key: AWS_REGION
        value: us-east-2
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false

  - type: web
    name: iq-ai-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://iq-ai-api.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
