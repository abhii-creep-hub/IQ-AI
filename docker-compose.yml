services:
  db:
    image: postgres:16-alpine
    container_name: iqai_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: iqai_user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: iqai_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iqai_user -d iqai_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: iqai_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://iqai_user:password@db:5432/iqai_db
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-super-secret-change-me}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-sk-placeholder}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - CORS_ORIGINS=["http://localhost:5173","http://localhost:3000","http://localhost"]
      - UPLOAD_DIR=./uploads
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: iqai_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
